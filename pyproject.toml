[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clash_controller"
version = "0.1.0"
description = "A controller for Clash"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "Moha-Master", email = "hongkongreporter@outlook.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "requests_unixsocket",
    "InquirerPy",
    "paramiko",
    "scp"
]

[project.scripts]
clashctl = "clash_controller.cli:main"

[project.urls]
Homepage = "https://github.com/Moha-Master/Clash-Controller"
Repository = "https://github.com/Moha-Master/Clash-Controller"
Issues = "https://github.com/Moha-Master/Clash-Controller/issues"
