[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clash_controller"
version = "0.2.0"
description = "A Textual TUI for managing Clash proxy instances"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Moha-Master", email = "hongkongreporter@outlook.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "requests_unixsocket",
    "paramiko",
    "textual>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio",
]

[project.scripts]
clashctl = "clash_controller.main:main"

[project.urls]
Homepage = "https://github.com/Moha-Master/Clash-Controller"
Repository = "https://github.com/Moha-Master/Clash-Controller.git"
GitHub = "https://github.com/Moha-Master/Clash-Controller"
Issues = "https://github.com/Moha-Master/Clash-Controller/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["clash_controller*"]
exclude = ["tests*", "venv*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
clash_controller = ["*.tcss"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
